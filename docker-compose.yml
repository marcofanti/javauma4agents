    environment:
      PYTHONPATH: /driver/lib
      UMA4A_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
      PYTHONUNBUFFERED: "1"
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      UMA4A_ALICE_OPERATOR: https://alice-agent.uma.lab
    volumes:
      - ./conformance/upstream/clients/demo-driver/driver.py:/driver/driver.py:ro
      - ./conformance/upstream/lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
