# UMA for Agents — the demo stack.
#   make init && make up && make smoke-test
# See docs/ARCHITECTURE.md for the system design.
#
# The tokens/passwords below are LOCAL LAB demo defaults, not secrets. Override
# them via a .env file (see .env.example) and never reuse them anywhere real or
# expose this stack on a public network.

services:
  dns:
    init: true
    image: docker.io/hickorydns/hickory-dns:0.25.2
    ports:
      # Host ports are overridable so a second stack (a Python control run, say) can
      # run beside this one under its own Compose project.
      - "${UMA4A_DNS_PORT:-5053}:53/tcp"
      - "${UMA4A_DNS_PORT:-5053}:53/udp"
    volumes:
      - ./dns/named.toml:/etc/named.toml:ro
      - ./dns/uma.lab.zone:/var/named/uma.lab.zone:ro

  edge:
    init: true
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    ports:
      - "${UMA4A_EDGE_PORT:-443}:443"
    volumes:
      - ./edge/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs/edge-server.pem:/certs/edge-server.pem:ro
      - ./certs/edge-server-key.pem:/certs/edge-server-key.pem:ro
    networks:
      default:
        aliases:
          - alice-as.uma.lab
          - carol-as.uma.lab
          - carol-portal.uma.lab
          - northwind-org.uma.lab
          - joint-tally.uma.lab
          - northwind-xaa.uma.lab
          - n8n.uma.lab
          - northwind-idp.uma.lab
          - org-console.uma.lab
          - keycloak.uma.lab
          - gateway.uma.lab
          - portal.uma.lab
          - grafana.uma.lab
          - ps.uma.lab
          - agent.uma.lab
          - alice-agent.uma.lab

  keycloak:
    init: true
    image: quay.io/keycloak/keycloak:26.4.5
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-uma4agents-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://keycloak.uma.lab
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  northwind-idp:
    init: true
    image: quay.io/keycloak/keycloak:26.4.5
    command: start-dev --import-realm --health-enabled=true --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NORTHWIND_IDP_ADMIN_PASSWORD:-northwind-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://northwind-idp.uma.lab
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak-northwind/:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  uma-as:
    init: true
    build:
      context: .
      dockerfile: services/uma-as/Dockerfile
    environment:
      # Registration is declarative: the AS reads the RS's published metadata
      # (public structure + protected owner instances) and never takes pushes.
      UMA_AS_RS_RESOURCE_URI: https://gateway.uma.lab/mcp
      UMA_AS_ISSUER: https://alice-as.uma.lab
      UMA_AS_ORG_ISSUER: https://northwind-org.uma.lab
      UMA_AS_ORG_CALLBACK: https://alice-as.uma.lab
      UMA_AS_ORG_TTL_S: ${UMA_AS_ORG_TTL_S:-30}
      # The resource-server client the AS issues PATs to (client_credentials,
      # scope uma_protection). Alice's day-0 consent for it is seeded.
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      # Two independent credentials for one person: her browser session (OIDC,
      # through the portal) and a key her device holds (RFC 9421). Neither is a
      # fallback for the other.
      UMA_AS_OWNER_AUTH: oidc,local-key
      UMA_AS_OWNER_ISSUER: https://keycloak.uma.lab/realms/alice
      UMA_AS_OWNER_KEY: /owner/owner-ed25519.pub
      UMA_AS_OWNER_AUTHORITY: alice-as.uma.lab
      UMA_AS_OWNER: alice
      # A signature proves a holder, not an owner, so the device key names whose it is.
      UMA_AS_OWNER_KEY_OWNER: alice
      # Trust bundle for verifying issuers' TLS (AAuth dwk discovery and the
      # realm's JWKS both ride https; the lab CA signs *.uma.lab).
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      # The agent providers whose tokens she believes. One: the person server
      # her identified agents enrol with. Any other issuer is never fetched.
      UMA_AS_AGENT_ISSUERS: https://ps.uma.lab
      # The signing key and its kid, and the keys retired before it. Left at their
      # defaults except by `make rotation-check`, which rotates and restores in one run.
      UMA_AS_SIGNING_KEY: ${UMA_AS_SIGNING_KEY:-/keys/uma-as-ed25519.pem}
      UMA_AS_KID: ${UMA_AS_KID:-uma-as-1}
      UMA_AS_PREVIOUS_KEYS: ${UMA_AS_PREVIOUS_KEYS:-}
      UMA_AS_PREVIOUS_KIDS: ${UMA_AS_PREVIOUS_KIDS:-}
      # In memory by default, which is enough for one process and rewound by a restart
      # (make reset). A check that recreates this container under live grants runs it on
      # the `pg` service instead: a recreate empties a memory store.
      UMA_AS_STORE: ${UMA_AS_STORE:-memory}
      UMA_AS_DATABASE_URL: ${UMA_AS_DATABASE_URL:-}
    volumes:
      - uma-as-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      # Only the public half (make owner-key). Her private key never leaves her side.
      - ./certs/owner-ed25519.pub:/owner/owner-ed25519.pub:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  carol-as:
    init: true
    build:
      context: .
      dockerfile: services/uma-as/Dockerfile
    environment:
      UMA_AS_OWNER: carol
      UMA_AS_ISSUER: https://carol-as.uma.lab
      UMA_AS_ORG_ISSUER: https://northwind-org.uma.lab
      UMA_AS_ORG_CALLBACK: https://carol-as.uma.lab
      UMA_AS_ORG_TTL_S: ${UMA_AS_ORG_TTL_S:-30}
      UMA_AS_SEED_RS: "0"
      UMA_AS_OWNER_AUTH: oidc
      UMA_AS_OWNER_ISSUER: https://keycloak.uma.lab/realms/carol
      UMA_AS_OWNER_AUTHORITY: carol-as.uma.lab
      UMA_AS_AGENT_ISSUERS: https://ps.uma.lab
      UMA_AS_PEND_BUDGET: ${UMA_AS_PEND_BUDGET:-5}
      UMA_AS_PEND_BUDGET_ATTRIBUTED: ${UMA_AS_PEND_BUDGET_ATTRIBUTED:-40}
      UMA_AS_STORE: ${UMA_AS_STORE:-memory}
      UMA_AS_DATABASE_URL: ${UMA_AS_DATABASE_URL:-}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - carol-as-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  uma-pep:
    init: true
    build:
      context: .
      dockerfile: services/uma-pep/Dockerfile
    environment:
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      UMA_PEP_RS_SECRETS: >-
        {"alice": "${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}"}
      UMA_EXTRA_OWNERS: carol
      UMA_OWNER_AUTHORITIES: >-
        {"carol": {"public": "https://carol-as.uma.lab",
                   "internal": "http://carol-as:9000"}}
      UMA_REALM: alice-vault
      UMA_PEP_ORG_ISSUER: https://northwind-org.uma.lab
      UMA_PEP_ORG_INTERNAL: http://org-authority:9040
      UMA_PEP_MEMBERSHIP_TTL_S: ${UMA_PEP_MEMBERSHIP_TTL_S:-10}
      UMA_PEP_ORG_DISCOVERY_TTL_S: ${UMA_PEP_ORG_DISCOVERY_TTL_S:-15}
      UMA_PEP_ORG_TOKEN: ${ORG_RS_TOKEN:-org-rs-dev-token}
      UMA_PEP_SHARED_NAMESPACE: northwind-vault
      UMA_PEP_JOINT_TALLY: https://joint-tally.uma.lab
      UMA_PEP_JOINT_TALLY_INTERNAL: http://joint-tally:9060
      UMA_PEP_JOINT_SECRET: ${TALLY_RS_SECRET:-tally-rs-dev-secret}
      UMA_PEP_JOINT_ACCOUNTS: meridian-joint,meridian-either
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      UMA_EXPECTED_AUTHORITY: gateway.uma.lab
    volumes:
      - uma-pep-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      uma-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9002/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.4.0
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./gateway/agw.yaml:/etc/agentgateway/config.yaml:ro
    depends_on:
      uma-pep:
        condition: service_healthy

  alice-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      # gateway (default): the ext_authz service ahead of this server carries
      # the enforcement obligations. embedded: the same enforcement core runs
      # in this process, ahead of the MCP transport, and publishes for itself.
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-gateway}
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      UMA_REALM: alice-vault
      UMA_EXPECTED_AUTHORITY: gateway.uma.lab
      # The origin's signing key, shared read-only with the gateway process:
      # it identifies gateway.uma.lab in both enforcement modes.
      UMA_PEP_SIGNING_KEY: /keys/uma-pep-ed25519.pem
    volumes:
      - uma-pep-keys:/keys:ro
    depends_on:
      uma-pep:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9020/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  carol-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: carol
      UMA_VAULT_FIXTURES: /app/fixtures-carol.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9020/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  northwind-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: northwind
      UMA_VAULT_FIXTURES: /app/fixtures-northwind.json
      ENFORCEMENT_MODE: gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9020/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  joint-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: joint
      UMA_VAULT_FIXTURES: /app/fixtures-joint.json
      ENFORCEMENT_MODE: gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9020/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  alice-portal:
    init: true
    build:
      context: .
      dockerfile: services/alice-portal/Dockerfile
    environment:
      UMA_AS_INTERNAL: http://uma-as:9000
      PORTAL_AUTH: ${PORTAL_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/alice
      OIDC_CLIENT_ID: meridian-portal
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      VAULT_MCP_URL: http://alice-vault-mcp:9020/mcp
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9010/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  carol-portal:
    init: true
    build:
      context: .
      dockerfile: services/alice-portal/Dockerfile
    environment:
      UMA_AS_INTERNAL: http://carol-as:9000
      PORTAL_AUTH: ${PORTAL_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/carol
      UMA_PORTAL_OWNER: carol
      PORTAL_PUBLIC_URL: https://carol-portal.uma.lab
      OIDC_CLIENT_ID: meridian-portal
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      VAULT_MCP_URL: http://carol-vault-mcp:9020/mcp
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9010/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  opa:
    init: true
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error"]
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 3s
      timeout: 5s
      retries: 10

  joint-tally:
    init: true
    build:
      context: .
      dockerfile: services/joint-tally/Dockerfile
    environment:
      TALLY_ISSUER: https://joint-tally.uma.lab
      TALLY_AUDIENCE: https://gateway.uma.lab
      TALLY_RS_SECRET: ${TALLY_RS_SECRET:-tally-rs-dev-secret}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      # A minimum the holders may not vote themselves below. Zero here so the
      # lab can carry both an every-holder account and an either-holder one;
      # set it and the second is refused at startup, by name. The floor is
      # what an account agreement or a regulator supplies in the world, and
      # it is the only answer to what quorum sets the quorum.
      TALLY_THRESHOLD_FLOOR: ${TALLY_THRESHOLD_FLOOR:-0}
      TALLY_SIGNING_KEY: /keys/tally-ed25519.pem
      TALLY_MANDATES: '{"meridian-joint":{"resources":["meridian-joint/get_positions","meridian-joint/get_transactions","meridian-joint/execute_trade"],"holders":[{"owner":"alice","issuer":"https://alice-as.uma.lab"},{"owner":"carol","issuer":"https://carol-as.uma.lab"}],"rule":{"kind":"all"}},"meridian-either":{"resources":["meridian-either/get_positions","meridian-either/get_transactions","meridian-either/execute_trade"],"holders":[{"owner":"alice","issuer":"https://alice-as.uma.lab"},{"owner":"carol","issuer":"https://carol-as.uma.lab"}],"rule":{"kind":"any"}}}'
    volumes:
      - tally-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      uma-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9060/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  org-authority:
    init: true
    build:
      context: .
      dockerfile: services/org-authority/Dockerfile
    environment:
      ORG_ISSUER: https://northwind-org.uma.lab
      ORG_ID: northwind
      ORG_NAME: Northwind Capital
      ORG_ADMIN_ISSUER: https://keycloak.uma.lab/realms/northwind
      ORG_ADMIN_CLIENTS: meridian-org-console
      OPA_URL: http://opa:8181
      ORG_RS_TOKEN: ${ORG_RS_TOKEN:-org-rs-dev-token}
      ORG_JOIN_CODE: ${ORG_JOIN_CODE:-NW-7K2F-QX}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - org-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9040/health"]
      interval: 3s
      timeout: 5s
      retries: 10


  xaa-broker:
    init: true
    build:
      context: .
      dockerfile: services/xaa-broker/Dockerfile
    environment:
      XAA_ISSUER: https://northwind-xaa.uma.lab
      # Northwind's own directory. Meridian's Keycloak is a different
      # party and its word about who Northwind employs is worth nothing.
      XAA_IDP_ISSUER: https://northwind-idp.uma.lab/realms/employees
      XAA_ADMINS: dana
      XAA_IDP_ADMIN_CLIENT: northwind-idp-admin
      XAA_CLIENTS: '{"northwind-research-agent": "${XAA_AGENT_SECRET:-northwind-agent-secret}"}'
      # The edges Dana approved. Two, because Northwind's book is administered
      # by two members and each runs her own authority — the assertion has to
      # be audienced at whichever one holds the resource.
      XAA_SEED_CONNECTIONS: >-
        [{"id": "nw-alice", "requesting_client": "northwind-research-agent",
          "audience": "https://alice-as.uma.lab",
          "resource": "https://gateway.uma.lab/mcp",
          "scopes": ["get_positions", "get_balance"]},
         {"id": "nw-carol", "requesting_client": "northwind-research-agent",
          "audience": "https://carol-as.uma.lab",
          "resource": "https://gateway.uma.lab/mcp",
          "scopes": ["get_positions", "get_balance"]}]
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - xaa-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      northwind-idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  org-console:
    init: true
    build:
      context: .
      dockerfile: services/alice-portal/Dockerfile
    environment:
      UMA_PORTAL_MODE: org-console
      STATIC_DIR: /app/org-console-static
      SERVER_PORT: "9050"
      ORG_AUTHORITY_INTERNAL: http://org-authority:9040
      CONSOLE_AUTH: ${CONSOLE_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/northwind
      OIDC_CLIENT_ID: meridian-org-console
      CONSOLE_PUBLIC_URL: https://org-console.uma.lab
      CONSOLE_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
      org-authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9050/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  # The firm that operates Bob's agent: its CIMD document and Web Bot Auth key
  # directory at https://agent.uma.lab.
  agent-operator:
    init: true
    build:
      context: .
      dockerfile: services/agent-operator/Dockerfile
    environment:
      AGENT_OPERATOR_ORIGIN: https://agent.uma.lab
      # Only the operator's own agents put keys in its directory.
      AGENT_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9030/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Alice's own web presence: the same operator service, a second instance with her
  # origin. An operator directory is a party's own infrastructure, and the service holds
  # no authoritative state, so running another is correct rather than a duplication.
  alice-operator:
    init: true
    build:
      context: .
      dockerfile: services/agent-operator/Dockerfile
    environment:
      AGENT_OPERATOR_ORIGIN: https://alice-agent.uma.lab
      AGENT_OPERATOR_NAME: Alice's own agent
      AGENT_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9030/health"]
      interval: 3s
      timeout: 5s
      retries: 10

  person-server:
    init: true
    build:
      context: ./aauth
      dockerfile: person-server.Dockerfile
    environment:
      AAUTH_DATABASE_URL: sqlite:////data/aauth.db
      AAUTH_PS_SIGNING_KEY_PATH: /data/.aauth/ps-signing-key.pem
      AAUTH_AS_SIGNING_KEY_PATH: /data/.aauth/as-signing-key.pem
      AAUTH_PS_PUBLIC_ORIGIN: https://ps.uma.lab
      AAUTH_AS_PUBLIC_ORIGIN: https://ps.uma.lab
      AAUTH_AS_SERVER_DOMAIN: ps.uma.lab
      AAUTH_PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      AAUTH_AS_PERSON_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      AAUTH_PS_INSECURE_DEV: "true"
      AAUTH_AS_INSECURE_DEV: "true"
    volumes:
      - ps-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/.well-known/aauth-person.json"]
      interval: 5s
      timeout: 5s
      retries: 15

  loki:
    init: true
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    init: true
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    init: true
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SERVER_ROOT_URL: https://grafana.uma.lab
