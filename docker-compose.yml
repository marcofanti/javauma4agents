  # A second requesting agent, in TypeScript, sharing no code with the Python
  # one: the pinned upstream client, built and run unchanged.
  ts-agent-check:
    image: node:20.15.0
    entrypoint:
      - /bin/bash
      - -c
      - rm -rf /work && cp -r /agent /work && cd /work && npm ci --no-audit --no-fund >/dev/null && npm run build >/dev/null && npm run check
    environment:
      NODE_EXTRA_CA_CERTS: /driver/rootCA.pem
      UMA4A_CA_BUNDLE: /driver/rootCA.pem
      UMA4A_KEYS: /driver/keys
    volumes:
      - ./conformance/upstream/clients/ts-agent:/agent:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
