  # The agent-shim over stateless streamable HTTP, as the pinned adapter profile runs
  # it: for MCP clients with no U4A code of their own, inside the lab network.
  agent-shim:
    init: true
    build:
      context: .
      dockerfile: clients/agent-shim/Dockerfile
    entrypoint: ["java", "-jar", "/app/shim.jar"]
    environment:
      UMA4A_SHIM_TRANSPORT: streamable-http
      UMA4A_SHIM_HOST: 0.0.0.0
      UMA4A_SHIM_PORT: "9030"
      UMA4A_GATEWAY: https://gateway.uma.lab/mcp
      UMA4A_CACERT: /certs/rootCA.pem
      UMA4A_KEYSTORE: /keys/agent-key.pem
      # No interactive client above it, so Alice's terms are decided by Bob's
      # standing configuration — bounded, and set by a person in advance.
      UMA4A_STANDING_MAX_EXPIRES: "604800"
      UMA4A_PUBLISH_TO: ${UMA4A_ADAPTER_OPERATOR:-https://agent.uma.lab}
      UMA4A_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - driver-keys:/keys
    profiles: ["adapter"]

  adapter-check:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -ec
      - pip install -q 'mcp==2.3.0' 'httpx==0.28.1' && exec python /driver/adapter_check.py
    environment:
      UMA4A_SHIM_URL: http://agent-shim:9030/mcp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./conformance/upstream/clients/demo-driver/adapter_check.py:/driver/adapter_check.py:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
    profiles: ["adapter"]

  # Headless verification of the agent-shim under a scripted MCP client.
  shim-test:
    build:
      context: .
      dockerfile: clients/agent-shim/Dockerfile
    # The pinned upstream check, unchanged. UMA4A_REPO points at a runtime tree
    # whose clients/agent-shim/shim.py execs the Java shim jar.
    entrypoint: ["python3", "/checks/test_shim.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      # The check limits its simulated approvals to its own keys only when it can
      # import the vendored client library; without it, it approves whatever is first
      # in Alice's queue.
      PYTHONPATH: /runtime/lib
      UMA4A_REPO: /runtime
      UMA4A_JAVA_SHIM_JAR: /app/shim.jar
    volumes:
      - ./conformance/upstream/clients/agent-shim/test_shim.py:/checks/test_shim.py:ro
      - ./conformance/runtime/clients/agent-shim/shim.py:/runtime/clients/agent-shim/shim.py:ro
      - ./conformance/upstream/lib:/runtime/lib:ro
      - ./certs/rootCA.pem:/runtime/certs/rootCA.pem:ro
    profiles: ["test"]

  # Phase A spike evidence: the Python SDK handshake against the Java shim on stdio
  # and stateless HTTP, and a pend handed back and resumed (conformance/supplemental).
  # A database for the checks that need the authorization server to survive a
  # recreate, as upstream's: Postgres 17, the pinned DDL applied by uma-as itself.
  # Not part of the default stack, and it publishes no host port.
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: u4a
      POSTGRES_PASSWORD: u4a
      POSTGRES_DB: u4a
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U u4a -q"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: ["test"]

  # Writes the rotated signing key into uma-as's key volume. Upstream does this inside
  # the uma-as container with its Python; the Java image has none, so a helper does it
  # (completion rule 1). Like upstream's, it replaces a key left by an earlier run.
  rotation-keygen:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install -q 'cryptography==50.0.2' && exec python - "$$@" <<'PY'
        import os, sys
        from cryptography.hazmat.primitives import serialization as s
        from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
        path = sys.argv[1]
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
        with os.fdopen(fd, "wb") as fh:
            fh.write(Ed25519PrivateKey.generate().private_bytes(
                s.Encoding.PEM, s.PrivateFormat.PKCS8, s.NoEncryption()))
        print(f"wrote {path}")
        PY
      - --
    volumes:
      - uma-as-keys:/keys
    profiles: ["test"]

  # Signing-key rotation under live grants: the pinned rotation_check.py, unchanged,
  # in two phases around the recreate of uma-as that `make rotation-check` performs.
  rotation-check:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q 'httpx==0.28.1' 'pyjwt[crypto]==2.15.1' 'cryptography==50.0.2' && exec python /driver/rotation_check.py "$$@"
