      UMA4A_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./conformance/upstream/clients/demo-driver/rotation_check.py:/driver/rotation_check.py:ro
      - ./conformance/upstream/lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["test"]

  shim-spike:
    build:
      context: .
      dockerfile: clients/agent-shim/Dockerfile
    entrypoint: ["python3", "/checks/shim_spike.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /runtime/lib
      UMA4A_REPO: /runtime
      UMA4A_JAVA_SHIM_JAR: /app/shim.jar
    volumes:
      - ./conformance/supplemental/shim_spike.py:/checks/shim_spike.py:ro
      - ./conformance/runtime/clients/agent-shim/shim.py:/runtime/clients/agent-shim/shim.py:ro
      - ./conformance/upstream/lib:/runtime/lib:ro
      - ./certs/rootCA.pem:/runtime/certs/rootCA.pem:ro
    profiles: ["test"]

  paios:
    init: true
    build:
      context: .
      dockerfile: kwaai/Dockerfile
    environment:
      PAIOS_HOST: 0.0.0.0
      U4A_AUTHORITY_URL: https://alice-as.uma.lab
      U4A_AUTHORITY_NAME: alice-as.uma.lab
      U4A_OWNER_KEY: /owner/owner-ed25519.pem
      U4A_CA_BUNDLE: /certs/rootCA.pem
      # Her standing consent, set by her. Without it the ability denies
      # everything, because pAI-OS gives it no way to ask her.
      U4A_AUTO_TIERS: ${PAIOS_AUTO_TIERS:-tier1}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      # Her private key. Only this container and she have it; her
      # authorization server holds the public half.
      - ./certs/owner-ed25519.pem:/owner/owner-ed25519.pem:ro
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - paios-data:/opt/paios/data
      - paios-check-keys:/driver/keys
    depends_on:
      uma-as:
        condition: service_healthy
    profiles: ["kwaai"]

  # The personal-AI binding against the full stack: her authority, her portal,
  # the gateway and the vault all as they really are — and a personal AI
  # holding her key instead of a browser session.
  kwaai-check:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q 'httpx==0.28.1' 'pyjwt[crypto]==2.15.1' 'cryptography==50.0.2' && exec python /kwaai/check.py
    environment:
      PYTHONPATH: /driver/lib
      UMA4A_OPERATOR_REGISTER_TOKEN: ${OPERATOR_REGISTER_TOKEN:-uma4agents-operator-register}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./conformance/upstream/kwaai:/kwaai:ro
      - ./conformance/upstream/lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - ./certs/owner-ed25519.pem:/owner/owner-ed25519.pem:ro
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["test"]

  n8n:
    image: n8nio/n8n:2.38.6@sha256:7406a977895d0158ab0f5b2a3dc66de636711f36c06f0e2e2b1c391fc91f8ec3
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        n8n import:credentials --input=/fixtures/e2e-credentials.json
        n8n import:workflow --input=/fixtures/e2e-workflow.json
        n8n publish:workflow --id=u4aMcpStarter001
        exec n8n start
    environment:
      N8N_ENCRYPTION_KEY: testkeytestkeytestkey123
      N8N_USER_FOLDER: /tmp/n8nhome
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - ./conformance/upstream/integrations/n8n/lab:/fixtures:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 25
    profiles: ["n8n-lab"]

  n8n-sidecar:
    init: true
    build:
      context: .
      dockerfile: services/uma-pep/Dockerfile
    environment:
      UMA_PEP_UPSTREAM: http://n8n:5678/mcp/u4a-protected
      UMA_PEP_UPSTREAM_HEADER: X-Sidecar-Auth
      UMA_PEP_UPSTREAM_AUTH: only-the-sidecar-knows
      UMA_PEP_TOOLS: /config/tools.json
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: https://alice-as.uma.lab
      UMA_AS_RS_CLIENT_SECRET: ""
      UMA_OWNER: alice
      UMA_REALM: alice-vault
      UMA_EXPECTED_AUTHORITY: n8n.uma.lab
      UMA_PEP_RS_NAME: n8n workflow (Compose lab)
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - ./integrations/n8n/lab/tools.json:/config/tools.json:ro
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - sidecar-keys:/keys
    depends_on:
      n8n:
        condition: service_healthy
      uma-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9002/health"]
      interval: 3s
      timeout: 5s
      retries: 15
    profiles: ["n8n-lab"]

  n8n-check:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -ec
      - |
        pip install -q 'httpx==0.28.1' 'pyjwt[crypto]==2.15.1' 'cryptography==50.0.2'
        exec python /driver/n8n-check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      SSL_CERT_FILE: /driver/rootCA.pem
    working_dir: /driver
    volumes:
      - ./conformance/upstream/lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - ./certs/owner-ed25519.pem:/owner/owner-ed25519.pem:ro
      - ./conformance/supplemental/n8n-check.py:/driver/n8n-check.py:ro
      - ./conformance/upstream/integrations/conformance.py:/driver/upstream-conformance.py:ro
    profiles: ["n8n-lab"]

  portal-check:
    image: python:3.12.12-slim
    entrypoint:
      - /bin/bash
      - -ec
      - pip install -q 'httpx==0.28.1' && exec python /driver/portal-check.py
    environment:
      ORG_JOIN_CODE: ${ORG_JOIN_CODE:-NW-7K2F-QX}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./conformance/supplemental/portal-check.py:/driver/portal-check.py:ro
      - ./conformance/upstream/services/alice-portal/static:/assets/owner:ro
      - ./conformance/upstream/services/org-console/static:/assets/console:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
    profiles: ["test"]

volumes:
  uma-as-keys:
  carol-as-keys:
  org-keys:
  tally-keys:
  xaa-keys:
  sidecar-keys:
  paios-data:
  paios-check-keys:
  uma-pep-keys:
  ps-data:
  driver-keys:
  java-driver-keys:
